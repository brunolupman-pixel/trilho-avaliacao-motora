/* =====================================================================
   JOGO 2 — PILOTAR O CARRO (reto)
   Joystick no meio = neutro; para frente acelera; para trás freia/ré.
   ===================================================================== */
class JogoCarro {
  constructor(W, H, duracao, opcoes = {}) {
    this.duracao = duracao; this.pontos = 0; this.combo = 1; this.terminou = false; this.t = 0;
    this.metaPontos = duracao * 9;
    this.zonaCm = opcoes.zonaCm || 1.5; this.zona = opcoes.zonaFrac || 0.25; this.folga = 0.05;
    this.estado = 0; this.tempoEstado = { "-1": 0, "0": 0, "1": 0 }; this.maxFrente = 0; this.maxRe = 0;
    this.foraDoAlcance = false;
    this.vel = 0; this.alavanca = 0; this.pista = 0; this.avisos = new Avisos();
    // placas sorteadas a cada partida (antes era sempre a mesma sequência)
    this.placas = [this.sortearPlaca(null)];
    this.iPlaca = 0; this.tPlaca = 0; this.noAlvo = 0; this.tempoNoAlvo = 0; this.reacoes = []; this.esperandoReacao = true;
    this.tolerancia = opcoes.toleranciaCombo ?? 1.5; this.foraDoAlvo = 0;
    this.margemVel = opcoes.margemVel ?? 10;   // ± km/h em torno da placa que contam pontos
    this.trocas = 0; this.ladoAnt = 0;
    this.redimensionar(W, H);
  }
  redimensionar(W, H) { this.W = W; this.H = H; }
  // Próxima placa: 20 a 90 km/h ou PARE (0). Nunca repete a anterior, muda pelo menos 20 km/h,
  // PARE em ~1 de cada 6 placas e nunca dois PARE seguidos (nem PARE logo na primeira).
  sortearPlaca(ant) {
    if (ant !== null && ant !== 0 && Math.random() < 1 / 6) return 0;
    const ops = [20, 30, 40, 50, 60, 70, 80, 90].filter(v => ant === null || ant === 0 || Math.abs(v - ant) >= 20);
    return ops[Math.floor(Math.random() * ops.length)];
  }
  get alvo() {
    while (this.placas.length <= this.iPlaca) this.placas.push(this.sortearPlaca(this.placas[this.placas.length - 1]));
    return this.placas[this.iPlaca];
  }
  passo(e, dt, t) {
    this.t = t; this.avisos.passo(dt);
    const a = Math.max(-1, Math.min(1, e.f * 2 - 1));          // -1 = todo para trás, +1 = todo para frente
    this.foraDoAlcance = !!e.foraDoAlcance;
    // zona neutra com folga na borda (não fica piscando)
    if (this.estado === 0) { if (a > this.zona) this.estado = 1; else if (a < -this.zona) this.estado = -1; }
    else if (this.estado === 1 && a < this.zona - this.folga) this.estado = 0;
    else if (this.estado === -1 && a > -(this.zona - this.folga)) this.estado = 0;
    // intensidade: 0 logo depois da zona neutra, 1 no fim da fenda
    const intens = this.estado === 0 ? 0 : Math.min(1, Math.max(0, (Math.abs(a) - this.zona) / (1 - this.zona)));
    this.alavanca = this.estado * intens;
    this.a = a;
    this.tempoEstado[this.estado] += dt;
    if (this.estado === 1) this.maxFrente = Math.max(this.maxFrente, intens);
    if (this.estado === -1) this.maxRe = Math.max(this.maxRe, intens);
    const lado = Math.sign(this.alavanca);
    if (lado && lado !== this.ladoAnt) { if (this.ladoAnt) this.trocas++; this.ladoAnt = lado; }
    // para frente acelera; para trás é freio (mais forte quanto mais para trás). O carro nunca anda de ré.
    if (this.alavanca >= 0) this.vel += (this.alavanca * 100 - this.vel) * Math.min(1, dt * 0.9);
    else this.vel -= (20 + 80 * -this.alavanca) * dt;
    this.vel = Math.max(0, this.vel);
    this.pista += this.vel * dt * 6;
    // placas mudam a cada 7 s
    if (t - this.tPlaca > 7) { this.iPlaca++; this.tPlaca = t; this.esperandoReacao = true; this.avisos.add(this.alvo === 0 ? "PARE!" : "Nova placa: " + this.alvo, "#2f6fed"); Som.tocar(this.alvo === 0 ? "pare" : "placa"); }
    const dentro = Math.abs(this.vel - this.alvo) < this.margemVel;
    if (dentro) {
      if (this.esperandoReacao) { this.reacoes.push(t - this.tPlaca); this.esperandoReacao = false; this.avisos.add("Na velocidade certa!"); Som.tocar("conquista"); }
      this.noAlvo += dt; this.tempoNoAlvo += dt;
      this.combo = Math.min(3, 1 + Math.floor(this.noAlvo / 3));
      this.pontos += 10 * dt * this.combo;
      this.foraDoAlvo = 0;
    } else {
      // tolerância: o combo só se perde depois de alguns segundos seguidos fora da velocidade.
      // Fora da faixa não ganha pontos, e o tempo para subir o combo fica congelado.
      this.foraDoAlvo += dt;
      if (this.foraDoAlvo > this.tolerancia) { this.noAlvo = 0; this.combo = 1; }
    }
    if (t >= this.duracao) this.terminou = true;
  }
  textoObjetivo() { return Math.max(0, Math.ceil(this.duracao - this.t)) + "s"; }
  desenhar(ctx) {
    const { W, H } = this, cx = W / 2, larg = Math.min(360, W * 0.35);
    ctx.fillStyle = bv("#4d7c0f", "#0b2a00"); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = bv("#3f3f46", "#000"); ctx.fillRect(cx - larg / 2, 0, larg, H);
    if (BV) { ctx.fillStyle = "#fff"; ctx.fillRect(cx - larg / 2, 0, 8, H); ctx.fillRect(cx + larg / 2 - 8, 0, 8, H); }
    ctx.fillStyle = bv("#fafafa", "#ffe600");
    const lf = bv(10, 18);
    for (let y = -80; y < H + 80; y += 80) ctx.fillRect(cx - lf / 2, ((y + this.pista) % (H + 160) + H + 160) % (H + 160) - 80, lf, 44);
    ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.roundRect(cx - 32, H - 190, 64, 110, 14); ctx.fill();
    if (BV) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.stroke(); }
    ctx.fillStyle = "#1e293b"; ctx.fillRect(cx - 24, H - 170, 48, 26);
    // placa (maior no modo baixa visão)
    const rp = bv(60, 78), px = Math.min(W - rp - 16, cx + larg / 2 + bv(90, 110)), py = bv(130, 185);
    ctx.fillStyle = bv("#71717a", "#fff"); ctx.fillRect(px - 4, py, 8, 120);
    if (this.alvo === 0) {
      ctx.fillStyle = "#dc2626"; ctx.beginPath();
      for (let i = 0; i < 8; i++) { const an = Math.PI / 8 + i * Math.PI / 4; ctx.lineTo(px + (rp + 2) * Math.cos(an), py + (rp + 2) * Math.sin(an)); }
      ctx.fill(); if (BV) { ctx.closePath(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 6; ctx.stroke(); }
      texto(ctx, "PARE", px, py + 10, 28);
    } else {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px, py, rp, 0, 7); ctx.fill();
      ctx.strokeStyle = "#dc2626"; ctx.lineWidth = bv(12, 16); ctx.stroke(); texto(ctx, this.alvo, px, py + 14, 44, "#111");
    }
    // combo em risco: contagem da tolerância embaixo da placa
    if (this.combo > 1 && this.foraDoAlvo > 0) {
      const resta = Math.max(0, this.tolerancia - this.foraDoAlvo);
      balao(ctx, `Combo x${this.combo}: volte em ${resta.toFixed(1).replace(".", ",")} s`, px, py + bv(160, 190), "#d97706");
    }
    // velocímetro (maior: ocupa o espaço entre a alavanca e a pista)
    const espaco = cx - larg / 2 - 200;                       // da direita dos rótulos da alavanca até a pista
    const R = Math.max(105, Math.min(140, espaco / 2 - 8, (H - 200) / 2.2));
    const vx = cx - larg / 2 - R - 14, vy = H - R - 26, ra = R * 0.78;
    // tela estreita: o velocímetro invade a coluna da alavanca -> a alavanca fica mais curta, acima dele
    const ahMax = vx - R < 200 ? vy - R - 30 - 120 : Infinity;
    const A0 = Math.PI * 0.75, VARRE = Math.PI * 1.5, ang = v => A0 + VARRE * Math.max(0, Math.min(100, v)) / 100;
    ctx.fillStyle = bv("#101828", "#000"); ctx.beginPath(); ctx.arc(vx, vy, R, 0, 7); ctx.fill();
    if (BV) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.stroke(); }
    ctx.lineCap = "butt";
    ctx.strokeStyle = bv("#344054", "#555"); ctx.lineWidth = R * bv(0.17, 0.21); ctx.beginPath(); ctx.arc(vx, vy, ra, A0, A0 + VARRE); ctx.stroke();
    // faixa verde = velocidade da placa ± margem de pontuação (a mesma faixa que conta pontos)
    ctx.strokeStyle = bv("#16a34a", "#00e676"); ctx.beginPath(); ctx.arc(vx, vy, ra, ang(Math.max(0, this.alvo - this.margemVel)), ang(this.alvo + this.margemVel)); ctx.stroke();
    ctx.strokeStyle = bv("#bbf7d0", "#fff"); ctx.lineWidth = R * 0.03;                     // marca do valor exato da placa
    ctx.beginPath(); ctx.moveTo(vx + (ra - R * 0.1) * Math.cos(ang(this.alvo)), vy + (ra - R * 0.1) * Math.sin(ang(this.alvo)));
    ctx.lineTo(vx + (ra + R * 0.1) * Math.cos(ang(this.alvo)), vy + (ra + R * 0.1) * Math.sin(ang(this.alvo))); ctx.stroke();
    const angV = ang(this.vel);
    ctx.strokeStyle = bv("#fff", "#ffe600"); ctx.lineWidth = R * bv(0.05, 0.09); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx + ra * 0.9 * Math.cos(angV), vy + ra * 0.9 * Math.sin(angV)); ctx.stroke();
    ctx.fillStyle = bv("#fff", "#ffe600"); ctx.beginPath(); ctx.arc(vx, vy, R * 0.07, 0, 7); ctx.fill();
    texto(ctx, Math.round(this.vel), vx, vy + R * 0.62, Math.round(R * bv(0.42, 0.34)));
    texto(ctx, "km/h", vx, vy + R * 0.86, Math.round(R * bv(0.15, 0.12)), "#98a2b3");
    // alavanca
    const ax = 50, ay = 120, ah = Math.max(140, Math.min(H - 260, ahMax));
    texto(ctx, "Joystick", ax + 10, ay - 16, 16, "#fff", "left");
    ctx.fillStyle = bv("rgba(0,0,0,.35)", "#000"); ctx.beginPath(); ctx.roundRect(ax, ay, 40, ah, 20); ctx.fill();
    if (BV) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = bv("rgba(255,255,255,.15)", "rgba(255,255,255,.4)"); ctx.fillRect(ax, ay + ah / 2 - this.zona * ah / 2, 40, this.zona * ah);
    ctx.fillStyle = this.estado === 0 ? bv("#facc15", "#ffe600") : this.estado === 1 ? bv("#22c55e", "#00e676") : bv("#f97316", "#ff6d00");
    ctx.beginPath(); ctx.arc(ax + 20, ay + ah / 2 - (this.a || 0) * ah / 2, bv(18, 26), 0, 7); ctx.fill();
    if (BV) { ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.stroke(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(ax + 20, ay + ah / 2 - (this.a || 0) * ah / 2, 30, 0, 7); ctx.stroke(); }
    texto(ctx, this.estado === 0 ? "neutro" : this.estado === 1 ? "acelera" : "freia", ax + 52, ay + ah / 2 + 5, 14, "#fff", "left");
    if (this.foraDoAlcance) balao(ctx, "Sensor não vê o joystick", W / 2, H / 2, "#dc2626");
    texto(ctx, "frente", ax + 52, ay + 16, 14, "#e4e7ec", "left"); texto(ctx, "freio", ax + 52, ay + ah - 6, 14, "#e4e7ec", "left");
    this.avisos.desenhar(ctx, cx, 60);
  }
  resultado() {
    const reac = this.reacoes.length ? (this.reacoes.reduce((a, b) => a + b, 0) / this.reacoes.length).toFixed(1) : "—";
    const pct = Math.round(100 * this.tempoNoAlvo / Math.max(1, this.t));
    return {
      metricas: { "Tempo na velocidade certa": pct + "%", "Reação média às placas (s)": reac,
        "Trocas frente/freio": this.trocas,
        "Zona neutra (cm)": this.zonaCm.toFixed(1), "Margem de pontuação (km/h)": "± " + this.margemVel, "Tolerância do combo (s)": this.tolerancia,
        "Tempo acelerando / neutro / freando (s)": [1, 0, -1].map(k => this.tempoEstado[k].toFixed(0)).join(" / "),
        "Máximo para frente / para trás": Math.round(100 * this.maxFrente) + "% / " + Math.round(100 * this.maxRe) + "%",
        "Duração (s)": Math.round(this.t) },
      destaque: `${pct}% na velocidade certa`,
    };
  }
}

/* =====================================================================
   JOGO 3 — LIMPAR A JANELA (guarda-chuva / punho)
   ===================================================================== */
class JogoVidro {
  constructor(W, H, duracao, opcoes = {}) {
    this.sens = LIMPEZA[opcoes.limpeza] ? opcoes.limpeza : "normal"; this.fatorLimpeza = LIMPEZA[this.sens].fator;
    this.duracao = duracao; this.pontos = 0; this.combo = 1; this.terminou = false; this.t = 0;
    this.metaPontos = 900;
    this.C = 20; this.Lh = 10; this.sujeira = [];
    for (let i = 0; i < this.Lh; i++) { const l = []; for (let j = 0; j < this.C; j++) l.push(j < 2 || j >= this.C - 2 ? 1.6 : 1); this.sujeira.push(l); }
    this.total = this.sujeira.flat().reduce((a, b) => a + b, 0);
    this.f = 0.5; this.dir = 0; this.ini = 0.5; this.minP = 0.5; this.maxP = 0.5; this.passadas = 0; this.amplitudes = [];
    // Anti-"roubo": cada faixa só perde até PORPASSADA de sujeira por passada. Uma passada nova só
    // começa quando o pano muda de sentido depois de andar pelo menos MINTRACO do vidro; tremer ou
    // esfregar no mesmo lugar não limpa mais nada.
    this.PORPASSADA = 0.35 * this.fatorLimpeza; this.MINTRACO = 0.10;
    this.traco = 0; this.sentidoTraco = 0; this.extremo = null;
    this.tracoCol = new Array(this.C).fill(-1); this.gastoCol = new Array(this.C).fill(0);
    this.avisos = new Avisos();
    this.redimensionar(W, H);
  }
  redimensionar(W, H) { this.W = W; this.H = H; }
  passo(e, dt, t) {
    this.t = t; this.f = e.f; this.avisos.passo(dt);
    const col = Math.min(this.C - 1, Math.floor(this.f * this.C));
    // passada de limpeza: pela posição (não pela velocidade, que treme), com folga de MINTRACO
    if (this.extremo === null) this.extremo = this.f;              // antes do 1º sentido: ponto de partida
    if (this.sentidoTraco === 0) {
      if (Math.abs(this.f - this.extremo) >= this.MINTRACO) { this.sentidoTraco = Math.sign(this.f - this.extremo); this.extremo = this.f; }
    } else if ((this.f - this.extremo) * this.sentidoTraco > 0) {
      this.extremo = this.f;                                          // continua indo no mesmo sentido
    } else if ((this.extremo - this.f) * this.sentidoTraco >= this.MINTRACO) {
      this.traco++; this.sentidoTraco = -this.sentidoTraco; this.extremo = this.f;   // voltou de verdade: nova passada
    }
    let limpou = false;
    if (Math.abs(e.v) > 0.05) {
      for (const c of [col - 1, col, col + 1]) {
        if (c < 0 || c >= this.C) continue;
        if (this.tracoCol[c] !== this.traco) { this.tracoCol[c] = this.traco; this.gastoCol[c] = 0; }
        const passo = Math.min(dt * 1.2 * this.fatorLimpeza, this.PORPASSADA - this.gastoCol[c]);
        if (passo <= 0) continue;                      // esta faixa já foi limpa nesta passada
        limpou = true;
        this.gastoCol[c] += passo;
        for (let i = 0; i < this.Lh; i++) {
          const antes = this.sujeira[i][c];
          this.sujeira[i][c] = Math.max(0, antes - passo);
          this.pontos += (antes - this.sujeira[i][c]) * 3;
        }
      }
    }
    this.limpando = limpou ? Math.min(1, Math.abs(e.v) / 0.6) : 0;
    // passadas: cada mudança de sentido fecha uma passada
    this.minP = Math.min(this.minP, this.f); this.maxP = Math.max(this.maxP, this.f);
    const d = Math.sign(e.v);
    if (Math.abs(e.v) > 0.08 && d !== this.dir) {
      if (this.dir !== 0) {
        const amp = this.maxP - this.minP;
        if (amp > 0.25) {
          this.passadas++; this.amplitudes.push(amp);
          if (amp > 0.85) { this.combo = Math.min(3, this.combo + 1); this.pontos += 20 * this.combo; this.avisos.add("Passada completa! +" + 20 * this.combo); Som.tocar("conquista"); }
          else { this.combo = 1; this.avisos.add("Vá até a ponta!", "#f59e0b"); Som.tocar("ponta"); }
        }
      }
      this.dir = d; this.minP = this.maxP = this.f;
    }
    if (this.limpo() >= 0.99 || t >= this.duracao) this.terminou = true;
  }
  limpo() { return 1 - this.sujeira.flat().reduce((a, b) => a + b, 0) / this.total; }
  textoObjetivo() { return Math.max(0, Math.ceil(this.duracao - this.t)) + "s"; }
  desenhar(ctx) {
    const { W, H } = this;
    ctx.fillStyle = bv("#cfe8ff", "#fff"); ctx.fillRect(0, 0, W, H);
    const mx = W * 0.12, my = bv(90, 110), jw = W - 2 * mx, jh = H - bv(170, 190), cw = jw / this.C, ch = jh / this.Lh;
    ctx.fillStyle = bv("#8b5e34", "#000"); ctx.fillRect(mx - 18, my - 18, jw + 36, jh + 36);
    ctx.fillStyle = bv("#bfe3ff", "#e6f7ff"); ctx.fillRect(mx, my, jw, jh);
    for (let i = 0; i < this.Lh; i++) for (let j = 0; j < this.C; j++) {
      const s = Math.min(1, this.sujeira[i][j]);
      if (s > 0.01) { const x = Math.round(mx + j * cw), y = Math.round(my + i * ch); ctx.fillStyle = BV ? `rgba(60,35,10,${0.95 * s})` : `rgba(110,85,55,${0.85 * s})`; ctx.fillRect(x, y, Math.round(mx + (j + 1) * cw) - x, Math.round(my + (i + 1) * ch) - y); }
    }
    ctx.fillStyle = bv("#8b5e34", "#000"); ctx.fillRect(mx + jw / 2 - 6, my, 12, jh);
    const px = mx + this.f * jw, rw = bv(34, 44), rh = bv(60, 78);
    ctx.fillStyle = bv("#facc15", "#ffe600"); ctx.beginPath(); ctx.roundRect(px - rw, my + jh / 2 - rh, 2 * rw, 2 * rh, 14); ctx.fill();
    ctx.strokeStyle = bv("#ca8a04", "#000"); ctx.lineWidth = bv(3, 7); ctx.stroke();
    if (BV) { ctx.strokeStyle = "#ff00c8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(px - rw - 7, my + jh / 2 - rh - 7, 2 * rw + 14, 2 * rh + 14, 18); ctx.stroke(); }
    texto(ctx, `Vidro limpo: ${Math.round(100 * this.limpo())}%`, mx, bv(50, 62), 24, "#1d2433", "left");
    texto(ctx, `Passadas: ${this.passadas}`, W - mx, bv(50, 62), 24, "#1d2433", "right");
    this.avisos.desenhar(ctx, W / 2, 50);
  }
  resultado() {
    const amp = this.amplitudes.length ? Math.round(100 * this.amplitudes.reduce((a, b) => a + b, 0) / this.amplitudes.length) + "%" : "—";
    return {
      metricas: { "Vidro limpo": Math.round(100 * this.limpo()) + "%", "Passadas": this.passadas,
        "Amplitude média": amp, "Sensibilidade da limpeza": LIMPEZA[this.sens].nome, "Duração (s)": Math.round(this.t) },
      destaque: `${Math.round(100 * this.limpo())}% limpo, amplitude ${amp}`,
    };
  }
}
