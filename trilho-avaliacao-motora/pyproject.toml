[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trilho"
version = "0.1.0"
description = "Sistema de Avaliação Motora com Joysticks em Trilho — aplicativo da clínica e biblioteca de processamento"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "cryptography>=41",
]

[project.optional-dependencies]
jogos = ["pygame-ce>=2.4"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
trilho = "trilho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
